name: site
on:
  push:
    branches: [main]
    paths: ['web/**', 'plugins/**', 'crates/**', 'frida/**', 'Cargo.*', 'flake.*', 'nix/**', 'scripts/site.nu', 'scripts/sunbird-linux.sh', 'scripts/sunbird-macos.sh', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  ios:
    uses: ./.github/workflows/ios.yml
  # The desktop launchers and loaders. Ubuntu 22.04 links the Linux loader
  # against an older glibc than Discord's AppImage needs, so it loads anywhere
  # Discord runs. macOS Phoenix is arm64 only, which macos-15 builds natively.
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            files: |
              target/release/phoenix.dll
              target/release/phoenix-inject.exe
          - os: ubuntu-22.04
            toolchain: stable
            files: target/release/libphoenix.so
          - os: macos-15
            toolchain: stable
            files: target/release/libphoenix.dylib
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - if: runner.os == 'macOS'
        run: cargo +${{ matrix.toolchain }} test --locked -p phoenix-hook -p phoenix-sigs -p phoenix-ui-desktop
      - run: cargo +${{ matrix.toolchain }} build --locked --release -p phoenix-loader ${{ runner.os == 'Windows' && '-p phoenix-inject' || '' }}
      # The linker's signature loads, but AMFI logs a complaint about it.
      - if: runner.os == 'macOS'
        run: codesign --force --sign - target/release/libphoenix.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  build:
    needs: [ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command nu scripts/site.nu web
      - uses: actions/download-artifact@v4
        with:
          name: libphoenix-ios
          path: ios
      - run: mv ios/libphoenix.dylib web/plugins/libphoenix-ios.dylib
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop
      - run: |
          mv desktop/desktop-Windows/phoenix.dll web/plugins/phoenix-windows-x86_64.dll
          mv desktop/desktop-Windows/phoenix-inject.exe web/plugins/sunbird-windows-x86_64.exe
          mv desktop/desktop-Linux/libphoenix.so web/plugins/libphoenix-linux-x86_64.so
          mv desktop/desktop-macOS/libphoenix.dylib web/plugins/libphoenix-macos-arm64.dylib
          cp scripts/sunbird-linux.sh web/plugins/sunbird-linux.sh
          cp scripts/sunbird-macos.sh web/plugins/sunbird-macos.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The plugins stay TypeScript in plugins/*/src; assets.sunbird.tools serves them bundled.
      - run: npm install --no-save --no-package-lock esbuild@0.25.12
      - run: node web/tools/bundle-plugins.ts
        env:
          ESBUILD: node_modules/.bin/esbuild
      - run: |
          mkdir -p dist
          touch dist/.nojekyll
          cp -r web/pkg web/plugins web/version.json dist/
          tar czf dist/site.tar.gz -C web pkg plugins version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
