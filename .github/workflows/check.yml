name: check
# Runs every locator the runtime uses (`sigscan check`) against current Discord
# builds, so an update that breaks one shows up here before users hit it.
# Android builds are the tracker's latest alpha, the channel Phoenix ships on.
# Desktop Phoenix sits behind Discord's tester access, so it is checked only when
# the DISCORD_EXE_URL repository variable points at a copy of its Discord.exe.
on:
  push:
    paths: ['crates/hook/**', 'crates/sigs/**', 'crates/sigscan/**', 'Cargo.*', 'flake.*', '.github/workflows/check.yml']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  TRACKER: https://tracker.vendetta.rocks/tracker
jobs:
  locators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command cargo test --release -p phoenix-hook -p phoenix-sigs
      - run: nix develop --command cargo build --release -p sigscan
      - name: sigscan check
        env:
          DESKTOP: ${{ vars.DISCORD_EXE_URL }}
          MACOS: ${{ vars.DISCORD_MACOS_URL }}
        run: |
          missed=0
          check() {
            echo "::group::$1"
            target/release/sigscan "$2" check || { missed=1; echo "::error::$1: a locator missed"; }
            echo "::endgroup::"
          }
          alpha=$(curl -fsS "$TRACKER/index" | jq -r .latest.alpha)
          for abi in arm64_v8a armeabi_v7a; do
            curl -fsSL "$TRACKER/download/$alpha/config.$abi" -o split.apk
            unzip -p split.apk "lib/${abi/_/-}/liblibdiscord_wasm_host.so" > "$abi.so"
            check "$alpha $abi" "$abi.so"
          done
          if [ -n "$DESKTOP" ]; then
            curl -fsSL "$DESKTOP" -o Discord.exe
            check desktop Discord.exe
          else
            echo "::notice::DISCORD_EXE_URL is unset, desktop skipped"
          fi
          if [ -n "$MACOS" ]; then
            curl -fsSL "$MACOS" -o macos-phoenix
            if unzip -p macos-phoenix "Discord Phoenix.app/Contents/MacOS/Discord" > Discord-macos 2>/dev/null; then
              check macos Discord-macos
            else
              check macos macos-phoenix
            fi
          else
            echo "::notice::DISCORD_MACOS_URL is unset, macos skipped"
          fi
          exit $missed
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo test --locked -p phoenix-hook -p phoenix-sigs -p phoenix-ui-desktop -p phoenix-loader
      - run: cargo clippy --locked --no-deps -p phoenix-hook -p phoenix-sigs -p sigscan -p phoenix-ui-desktop -p stand-in --all-targets -- -D warnings
